name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Play Store project
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          rm -rf extracted
          mkdir extracted
          unzip -q DigitalCalculator-PlayStore-Ready-SOURCE.zip -d extracted
          cp -r extracted/app .
          cp extracted/settings.gradle .
          cp extracted/build.gradle .
          cp extracted/gradle.properties .

      - name: Fix Gradle signing variable names
        run: |
          sed -i 's/keyAlias keyAlias/keyAlias signingKeyAlias/' app/build.gradle
          sed -i 's/keyPassword keyPassword/keyPassword signingKeyPassword/' app/build.gradle

      - name: Decode signing keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > upload-key.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          gradle :app:bundleRelease --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCalculator-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
