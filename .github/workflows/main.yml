name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract new project
        run: |
          rm -rf app settings.gradle build.gradle gradle.properties
          rm -rf extracted
          mkdir extracted
          unzip -q DigitalCalculator-GitHub-Ready.zip -d extracted
          cp -r extracted/app .
          cp extracted/settings.gradle .
          cp extracted/build.gradle .
          cp extracted/gradle.properties .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCalculator-fixed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
